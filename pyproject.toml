[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enginesmith"
version = "0.3.0.dev0"
description = "An agentic harness that builds and optimizes a specialized inference engine for one model on your machine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
# The harness itself uses the standard library only.
dependencies = []

[project.optional-dependencies]
# The built-in reference implementation (Apple Silicon).
mlx = ["mlx-lm==0.32.2"]
# Task accuracy (MATH-500 with math-verify, IFEval with Google's checker in enginesmith/third_party).
quality = ["math-verify[antlr4_13_2]==0.9.0", "langdetect==1.0.9", "nltk==3.10.4", "absl-py==2.5.1",
           "immutabledict==4.3.1"]
dev = ["pytest>=8,<10"]

[project.scripts]
enginesmith = "enginesmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"enginesmith.third_party" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
