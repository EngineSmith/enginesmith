name: Bug
description: Something in EngineSmith does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command, and its output
      description: For a run, `enginesmith status RUN` and the end of `RUN/run.log`. Remove paths you do not want to share.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run enginesmith doctor`
      render: json
    validations:
      required: true
